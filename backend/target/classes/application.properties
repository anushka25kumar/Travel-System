spring.application.name=TravelSmart
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/travelsmart_demo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Anushka@25}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Spring Web Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.com.travelsmart=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO

# External Provider Configurations (Future-Ready)
travelsmart.providers.amadeus.client-id=${AMADEUS_CLIENT_ID:}
travelsmart.providers.amadeus.client-secret=${AMADEUS_CLIENT_SECRET:}
travelsmart.providers.amadeus.environment=${AMADEUS_ENVIRONMENT:test}
travelsmart.providers.amadeus.base-url=${AMADEUS_BASE_URL:https://test.api.amadeus.com}

travelsmart.providers.train.api-key=${TRAIN_API_KEY:}
travelsmart.providers.train.base-url=${TRAIN_API_BASE_URL:https://api.railwaydata.in/v1}

travelsmart.providers.bus.api-key=${BUS_API_KEY:}
travelsmart.providers.bus.base-url=${BUS_API_BASE_URL:https://api.redbus.in/v2}
